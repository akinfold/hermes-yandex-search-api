name: yandex
version: 0.1.6
description: "Yandex Search API backend: classic web search (web_search backend) plus a yandex_generative_search tool for grounded answers with citations. Requires YANDEX_API_KEY and YANDEX_FOLDER_ID."
author: akinfold
kind: backend
provides_web_providers:
  - yandex
provides_tools:
  - yandex_generative_search
requires_env:
  - name: YANDEX_API_KEY
    description: Yandex Cloud API key with access to Yandex Search API
    secret: true
  - name: YANDEX_FOLDER_ID
    description: Yandex Cloud folder ID for Search API requests
