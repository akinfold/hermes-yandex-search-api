name: yandex
version: 0.1.0
description: "Yandex Search API backend: classic web search (web_search backend) plus a yandex_generative_search tool for grounded answers with citations. Requires YANDEX_API_KEY and YANDEX_FOLDER_ID."
author: akinfold
kind: backend
provides_web_providers:
  - yandex
provides_tools:
  - yandex_generative_search
requires_env:
  - YANDEX_API_KEY
  - YANDEX_FOLDER_ID
