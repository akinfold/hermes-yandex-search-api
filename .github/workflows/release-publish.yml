name: Publish release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  build:
    name: Build
    uses: ./.github/workflows/release-build.yml

  # Installs the very artifacts built above into a real Hermes, every way the
  # README documents. Nothing is released or published unless it passes.
  install-check:
    name: Install check
    needs: build
    uses: ./.github/workflows/install-check.yml

  github-release:
    name: GitHub Release
    needs: [build, install-check]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - name: Download built artifacts
        uses: actions/download-artifact@v8
        with:
          name: release-artifacts
          path: dist
      - name: Create GitHub Release and upload assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME}"
          gh release create "$tag" dist/* \
            --repo "$GITHUB_REPOSITORY" \
            --title "$tag" \
            --generate-notes

  pypi-publish:
    name: Publish to PyPI
    needs: [build, install-check]
    # PyPI is opt-in: set repository variable PUBLISH_TO_PYPI=true and configure
    # a PyPI Trusted Publisher for this workflow. Forks without it are skipped.
    if: vars.PUBLISH_TO_PYPI == 'true'
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - name: Download built artifacts
        uses: actions/download-artifact@v8
        with:
          name: release-artifacts
          path: dist
      - name: Keep only Python distributions
        run: rm -f dist/*.zip
      - name: Publish to PyPI (Trusted Publishing)
        uses: pypa/gh-action-pypi-publish@release/v1
