name: E2E (live)

# Manual only. Runs the end-to-end suite against the LIVE Yandex Search API.
# Credentials come from the GitHub Environment named below — see README
# ("Running the live E2E tests").
#
# The plugin runs inside a real Hermes, set up the way its installer sets it up
# (see .github/actions/setup-hermes): the latest release by default, or main,
# which is what the installer checks out. `none` runs it on its own, on the
# stand-ins in _compat.py.
on:
  workflow_dispatch:
    inputs:
      hermes:
        description: "Hermes to run the plugin in"
        type: choice
        options: [release, main, none]
        default: release
      search_type:
        description: "Yandex search market override (blank = Environment var YANDEX_SEARCH_TYPE, else SEARCH_TYPE_RU)"
        type: string
        default: ""

permissions:
  contents: read

jobs:
  e2e:
    name: Live end-to-end tests
    runs-on: ubuntu-latest
    # This Environment must define the secrets YANDEX_API_KEY and
    # YANDEX_FOLDER_ID (and optionally the variable YANDEX_SEARCH_TYPE).
    environment: yandex-e2e
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Set up Hermes the way its installer does
        id: hermes
        if: inputs.hermes != 'none'
        uses: ./.github/actions/setup-hermes
        with:
          channel: ${{ inputs.hermes }}

      - name: Install the plugin into Hermes' virtualenv
        if: inputs.hermes != 'none'
        env:
          HERMES_PYTHON: ${{ steps.hermes.outputs.python }}
        run: |
          set -euo pipefail
          uv pip install --quiet --python "$HERMES_PYTHON" -e . pytest
          # Hermes' own code, or a failed run: never a quiet fallback to the stand-ins.
          "$HERMES_PYTHON" -c "from hermes_yandex_search._compat import HERMES_AVAILABLE; assert HERMES_AVAILABLE, 'the plugin cannot import Hermes'"
          echo "E2E_PYTHON=$HERMES_PYTHON" >> "$GITHUB_ENV"

      - name: Install the plugin on its own
        if: inputs.hermes == 'none'
        run: |
          python -m pip install -e '.[dev]'
          echo "E2E_PYTHON=$(command -v python)" >> "$GITHUB_ENV"

      - name: Run live E2E tests
        env:
          YANDEX_API_KEY: ${{ secrets.YANDEX_API_KEY }}
          YANDEX_FOLDER_ID: ${{ secrets.YANDEX_FOLDER_ID }}
          # Workflow input wins; otherwise fall back to an Environment variable.
          YANDEX_SEARCH_TYPE: ${{ inputs.search_type || vars.YANDEX_SEARCH_TYPE }}
        run: '"$E2E_PYTHON" -m pytest -m e2e -v'
