name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    name: Lint & format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install project (dev extras)
        run: python -m pip install -e '.[dev]'
      - name: Ruff lint
        run: ruff check .
      - name: Ruff format check
        run: ruff format --check .
      - name: Complexity gate (radon)
        run: |
          set -euo pipefail
          report=$(radon cc -s -n C hermes_yandex_search)
          if [ -n "$report" ]; then
            echo "$report"
            echo "::error::Functions rated C or worse — split them before merging."
            exit 1
          fi
          radon cc -a hermes_yandex_search | tail -1

  test:
    name: Unit tests (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install project (dev extras)
        run: python -m pip install -e '.[dev]'
      - name: Run unit tests
        run: python -m pytest --cov=hermes_yandex_search --cov-report=term-missing --cov-fail-under=90

  coverage-badge:
    name: Coverage badge
    needs: test
    # Only on pushes to main: computes coverage and publishes a shields.io
    # endpoint JSON to the orphan `badges` branch (no external service needed).
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install project (dev extras)
        run: python -m pip install -e '.[dev]'
      - name: Measure coverage
        id: cov
        run: |
          set -euo pipefail
          python -m pytest --cov=hermes_yandex_search --cov-report=json -q
          pct=$(python -c "import json; print(round(json.load(open('coverage.json'))['totals']['percent_covered']))")
          if   [ "$pct" -ge 90 ]; then color=brightgreen
          elif [ "$pct" -ge 80 ]; then color=green
          elif [ "$pct" -ge 70 ]; then color=yellowgreen
          elif [ "$pct" -ge 60 ]; then color=yellow
          else color=red
          fi
          echo "pct=$pct" >> "$GITHUB_OUTPUT"
          echo "color=$color" >> "$GITHUB_OUTPUT"
      - name: Publish badge JSON to the badges branch
        env:
          GH_TOKEN: ${{ github.token }}
          PCT: ${{ steps.cov.outputs.pct }}
          COLOR: ${{ steps.cov.outputs.color }}
        run: |
          set -euo pipefail
          work=$(mktemp -d)
          printf '{"schemaVersion":1,"label":"coverage","message":"%s%%","color":"%s"}\n' "$PCT" "$COLOR" \
            > "$work/coverage.json"
          cd "$work"
          git init -q
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -q -b badges
          git add coverage.json
          git commit -q -m "Update coverage badge: ${PCT}%"
          # Force-push keeps `badges` a single-commit, artifact-only branch.
          git push -q --force "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" badges
