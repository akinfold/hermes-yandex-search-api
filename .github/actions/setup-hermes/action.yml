# Hermes as a user gets it: the official installer, run as written.
#
# `main` is what the one-line install on the Hermes website and `hermes update`
# give today. That installer builds Hermes' runtime with its package manager,
# pm, on the Python pm pins. `release` runs the installer script of the latest
# release tag, pinned to that tag: what a user who has not updated yet runs.
# Any other value is taken as a branch or tag.
#
# Shared by the install check and the live e2e workflow, so both run the plugin
# inside the Hermes users have. Needs the repository checked out.
name: Set up Hermes
description: Install Hermes Agent with its official installer.

inputs:
  channel:
    description: >-
      `release` for the latest Hermes release, `main` for what the installer
      and `hermes update` check out by default, or any other branch or tag.
    default: release

outputs:
  python:
    description: The Python Hermes runs on, with Hermes importable.
    value: ${{ steps.setup.outputs.python }}

runs:
  using: composite
  steps:
    - id: setup
      shell: bash
      env:
        CHANNEL: ${{ inputs.channel }}
        GH_TOKEN: ${{ github.token }}
      run: |
        set -euo pipefail
        if [ "$CHANNEL" = release ]; then
          ref=$(gh api repos/NousResearch/hermes-agent/releases/latest --jq .tag_name)
        else
          ref=$CHANNEL
        fi
        args=(--non-interactive --skip-setup --skip-browser)
        [ "$ref" = main ] || args+=(--branch "$ref")
        # The script the one-line install serves, fetched through the API with the
        # job's token (unauthenticated raw downloads get rate-limited on shared
        # runners), and saved rather than piped so its stdin stays away from any
        # prompt.
        for attempt in 1 2 3 4 5; do
          gh api -H "Accept: application/vnd.github.raw" \
            "repos/NousResearch/hermes-agent/contents/scripts/install.sh?ref=$ref" \
            > "$RUNNER_TEMP/hermes-install.sh" && break
          [ "$attempt" = 5 ] && exit 1
          sleep $((attempt * 10))
        done
        bash "$RUNNER_TEMP/hermes-install.sh" "${args[@]}" </dev/null
        echo "$HOME/.local/bin" >> "$GITHUB_PATH"
        python=$(python3 "$GITHUB_WORKSPACE/tests/install/hermes_env.py")
        test -x "$python"
        version=$("$HOME/.local/bin/hermes" --version | head -1)
        echo "$version ($ref), running on $("$python" --version)" | tee -a "$GITHUB_STEP_SUMMARY"
        echo "python=$python" >> "$GITHUB_OUTPUT"
