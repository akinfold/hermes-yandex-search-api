# Hermes as a user gets it: the official installer, run as written.
#
# `release` runs the installer script of the latest published release, pinned
# to its tag. That is where `hermes update` takes an official install since
# Hermes v0.21.7, and where the one-line install on the Hermes website, the
# installer on main, lands a fresh install since 2026-10-15. `main` runs the
# installer on main with `--channel main`: the tip of Hermes main, where changes
# land before any release has them. Both build Hermes' runtime with its package
# manager, pm, on the Python pm pins. `legacy` runs the installer script of the
# tag v2026.9.24, the last release whose installer builds the older layout:
# Hermes in a virtualenv inside its checkout, `~/.hermes/hermes-agent/venv`,
# which README.md's PyPI command is for.
# Any other value is taken as a branch or tag.
#
# Shared by the install check and the live e2e workflow, so both run the plugin
# inside the Hermes users have. Needs the repository checked out.
name: Set up Hermes
description: Install Hermes Agent with its official installer.

inputs:
  channel:
    description: >-
      `release` for the latest published Hermes release, where `hermes update`
      and the one-line installer put a user, `main` for the tip of Hermes main,
      `legacy` for v2026.9.24, the last release in the older layout, or any
      other branch or tag.
    default: release

outputs:
  python:
    description: The Python Hermes runs on, with Hermes importable.
    value: ${{ steps.setup.outputs.python }}

runs:
  using: composite
  steps:
    - id: setup
      shell: bash
      env:
        CHANNEL: ${{ inputs.channel }}
        GH_TOKEN: ${{ github.token }}
      run: |
        set -euo pipefail
        # Shared runners get rate-limited now and then, so GitHub calls are retried.
        retry() {
          for attempt in 1 2 3 4 5; do
            "$@" && return 0
            [ "$attempt" = 5 ] && return 1
            sleep $((attempt * 10))
          done
        }
        case "$CHANNEL" in
          release) ref=$(retry gh api repos/NousResearch/hermes-agent/releases/latest --jq .tag_name) ;;
          legacy) ref=v2026.9.24 ;;
          *) ref=$CHANNEL ;;
        esac
        # The computer-use driver is no part of what a plugin needs. The
        # installers of v2026.9.24 and of main take the flag; an unknown flag
        # stops either of them, so add none they do not list.
        args=(--non-interactive --skip-setup --skip-browser --skip-computer-use)
        # Without `--channel`, main's installer puts the latest release in place;
        # `--channel main` makes it check out main's tip. Release installers up
        # to v0.22.2 have no `--channel`, so every other ref is pinned with
        # `--branch` alone.
        if [ "$ref" = main ]; then
          args+=(--channel main)
        else
          args+=(--branch "$ref")
        fi
        # The script the one-line install serves, fetched through the API with the
        # job's token rather than from raw.githubusercontent.com, and saved rather
        # than piped so its stdin stays away from any prompt.
        retry gh api -H "Accept: application/vnd.github.raw" \
          "repos/NousResearch/hermes-agent/contents/scripts/install.sh?ref=$ref" \
          > "$RUNNER_TEMP/hermes-install.sh"
        bash "$RUNNER_TEMP/hermes-install.sh" "${args[@]}" </dev/null
        echo "$HOME/.local/bin" >> "$GITHUB_PATH"
        python=$(python3 "$GITHUB_WORKSPACE/tests/install/hermes_env.py")
        test -x "$python"
        version=$("$HOME/.local/bin/hermes" --version | head -1)
        echo "$version ($ref), running on $("$python" --version)" | tee -a "$GITHUB_STEP_SUMMARY"
        echo "python=$python" >> "$GITHUB_OUTPUT"
